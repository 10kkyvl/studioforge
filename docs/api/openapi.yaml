openapi: 3.1.0
info: {title: StudioForge Local API, version: 1.0.0}
servers: [{url: /api/v1}]
paths:
  /health:
    get:
      summary: Local daemon health
      responses: {"200": {description: Healthy}}
  /session/bootstrap:
    post:
      summary: Exchange one-time token for an HttpOnly session
      responses: {"200": {description: Session established}}
  /snapshot:
    get:
      summary: Complete UI bootstrap snapshot
      responses: {"200": {description: Snapshot}}
  /events:
    get:
      summary: Replayable SSE events
      responses: {"200": {description: Stream}}
  /runs:
    post:
      summary: Idempotent run creation
      responses: {"201": {description: Queued}}
  /runs/{id}/diff:
    get:
      summary: Diff for a run; ?format=structured returns a parsed {stats, files} model instead of a raw diff string
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: format, in: query, required: false, schema: {type: string, enum: [structured]}}
      responses: {"200": {description: Diff}}
  /runs/{id}/rollback:
    post:
      summary: >-
        Restore a run's checkpoint; an empty body (or one naming no
        files/hunks) does a full non-destructive rollback onto a new branch,
        while a body naming files and/or hunks reverts just that selection in
        place behind its own safety commit
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "Full: branch, commitHash. Selective: commitHash, safetyCommit, revertedFiles, revertedHunks"}
        "400": {description: "No checkpoint recorded (no_checkpoint), or an unknown selection (invalid_selection)"}
        "409": {description: "project_busy, git_unavailable, not_git_repo, dirty_worktree, later_change_conflict, patch_check_failed, or rollback_failed"}
  /runs/{id}/review:
    post:
      summary: >-
        Resolve a run's reviewBeforeApply gate; apply keeps every change,
        reject reverts the run's whole diff in place via SelectiveRollback,
        apply-selected keeps only the named files/hunks (server inverts
        against the actual diff to compute what to revert)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status: applied|rejected|partial, safetyCommit, revertedFiles, revertedHunks}"}
        "400": {description: "invalid_review_action, or invalid_selection"}
        "404": {description: No pending review for this run}
        "409": {description: "review_not_pending, review_expired, project_busy, or the same rollback error set as /runs/{id}/rollback"}
  /projects/{id}/checkpoints:
    get:
      summary: A project's recorded git checkpoints, newest first
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses: {"200": {description: Checkpoints}}
  /projects/{id}/diff:
    get:
      summary: Structured diff between two refs ("HEAD" or a checkpoint commitHash); to defaults to HEAD
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: from, in: query, required: true, schema: {type: string}}
        - {name: to, in: query, required: false, schema: {type: string, default: HEAD}}
      responses:
        "200": {description: Diff}
        "400": {description: Missing from, or from is not an ancestor of to}
        "404": {description: Unknown checkpoint reference}
